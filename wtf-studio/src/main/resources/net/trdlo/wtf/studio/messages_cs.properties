# WTF – texty rozhraní, česky.
#
# Stejné klíče jako messages.properties, stejná pravidla (docs/open-questions.md D15):
#  - žádné skládání vět v kódu; zástupné symboly {0} jsou tady
#  - množné číslo obcházíme ("Listy: 6", ne "6 listů"), protože MessageFormat neumí tři tvary
