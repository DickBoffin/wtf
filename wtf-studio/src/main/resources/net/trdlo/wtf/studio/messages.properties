# --- step 0, start -----------------------------------------------------------------------------
start.title = Print a map, from one sheet to a whole wall
start.intro = WTF turns an online map into files you can print at home or at a print shop: a sheet \
  for a hike, a poster, a wall of wallpaper. The five steps on the left get you there, and the map \
  on the right shows what will be printed.
