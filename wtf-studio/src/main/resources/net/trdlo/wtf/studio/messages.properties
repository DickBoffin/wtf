# WTF interface strings.
#
# Read as UTF-8 (the default since Java 9). Rules in docs/open-questions.md D15:
#  - no concatenation in code; use {0} placeholders here
#  - avoid plural forms where a label will do ("Sheets: 6", not "6 sheets"), because Slavic plural
#    rules have three forms that MessageFormat cannot express
#  - a translation goes in messages_<tag>.properties beside this file and needs no code change

