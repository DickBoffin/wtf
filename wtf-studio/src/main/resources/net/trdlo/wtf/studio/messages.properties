project.refused.area = {0} does not reproduce its own area.\n\nIt says how the area was worked out – {1} – but working that out again gives a different shape. The two are up to {2} apart at their worst: the file states {3}, the settings give {4}.\n\nRather than print something other than what the file describes, it is refused. To open it as it stands, delete "simplify" or "custom" from "refine" in the file: the area is then a Custom area of the stored shape, grown by nothing and printed exactly, and nothing is lost but the note saying where it came from.
project.refused.size.across = {0} does not reproduce its own size.\n\nIt says the print was sized in sheets, {1} across, which comes to {2}, but its print block says {3}.\n\nRather than print something other than what the file describes, it is refused. To open it as it stands, delete "sheetsAcross" from "medium" in the file: the size is then given in millimeters, and the one the print block states is printed exactly.
project.refused.size.down = {0} does not reproduce its own size.\n\nIt says the print was sized in sheets, {1} down, which comes to {2}, but its print block says {3}.\n\nRather than print something other than what the file describes, it is refused. To open it as it stands, delete "sheetsDown" from "medium" in the file: the size is then given in millimeters, and the one the print block states is printed exactly.
project.refused.size.dpi = {0} does not reproduce its own size.\n\nIt says the print was sized at {1} DPI, which at zoom {2} comes to {3} wide, but its print block says {4}.\n\nRather than print something other than what the file describes, it is refused. To open it as it stands, delete "dpi" from "print" in the file: the size is then given in millimeters, and the one the print block states is printed exactly.
project.refused.size.scale = {0} does not reproduce its own size.\n\nIt says the print was sized at a scale of {1}, which comes to {2} wide, but its print block says {3}.\n\nRather than print something other than what the file describes, it is refused. To open it as it stands, delete "mapScale" from "print" in the file: the size is then given in millimeters, and the one the print block states is printed exactly.
