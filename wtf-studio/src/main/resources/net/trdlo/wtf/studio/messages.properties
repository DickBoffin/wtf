start.step.2 = how much map goes around it
start.step.3 = sheets or a roll, and how big the print is
start.step.4 = how much the map shows, and in what colors
start.step.5 = the map downloaded and the files written
start.map = Drag the map to move it; turn the mouse wheel to zoom.
start.examples = Start from an example
start.examples.hint = An example opens as a new project with every step filled in. Change \
  anything – it is yours.
example.hike = A map for a hike
example.hike.body = Zermatt and the Matterhorn at 1:25 000 on two A4 sheets from a home \
  printer, with a scale bar.
example.poster = A country on a poster
example.poster.body = Switzerland alone on white, its border drawn, on one A1 sheet for a print \
  shop.
example.wallpaper = Wallpaper for the living room
